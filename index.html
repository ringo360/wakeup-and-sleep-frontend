<!-- Header -->
<head>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <title>早寝早起き朝ごはんアプリ</title>
</head>

<html>
    <body>
        <script src="index.js"></script>
        <script async src="/scripts/util.js"></script>
        <script src="/scripts/auth.js"></script>
        <script src="/scripts/header.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.x/dist/index.umd.js"></script>
        <!-- <script src="/scripts/particle.js"></script> -->
        <aside id="header"></aside>
        <div class="app" id="app">
            <div class="title">
                <h1>早寝早起き朝ごはんアプリ</h1>
            </div>
            <div class="buttons">
                <button id="wakeup" class="btnbase graybtn" onclick="wakeup(this)">Loading...</button>
                <button id="sleep" class="btnbase graybtn" onclick="sleep(this)">Loading...</button>
            </div>
            <hr id="mainhr">
            <div class="list">
                <h2>就寝・起床時間の記録</h2>
                <!-- <table border="1"> -->
                <table id="slog">
                    <!-- タイトル -->
                    <tr>
                        <th>日付</th>
                        <th>起床</th>
                        <th>就寝</th>
                        <th>朝食</th>
                    </tr>
					<tr>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                        <td><input type="checkbox" onchange="checkbf(this)"></td>
                    </tr>
					<!-- data -->
                </table>
            </div>
        </div>
        <div id="overlay"></div>
    </body>
</html>

<script>
</script>

<style>
    a {
     color: black;
      text-decoration: none;
    }
    a:hover {
     color: aqua;
     cursor: pointer;
    }
</style>

<script>
    function checkbf(elem) {
        console.log(elem)
        console.log(elem.checked)
        if (elem.checked === true) {
            launchFireworks(3000)
        }
    }
</script>
