<!-- Header -->
<head>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <title>早寝早起き朝ごはんアプリ</title>
</head>

<html>
    <body>
        <!-- 外部ライブラリ -->
        <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.x/dist/index.umd.js"></script>
        <!-- いろいろ -->
        <script src="index.js"></script>
        <script src="/scripts/auth.js"></script>
        <script src="/scripts/header.js"></script>
        <script async src="/scripts/util.js"></script>
        <script async src="/scripts/particle.js" defer></script>
        <aside id="header"></aside>
        <div class="app" id="app">
            <div class="title">
                <h1>早寝早起き朝ごはんアプリ</h1>
            </div>
            <div class="msg" style="margin: 0; margin-bottom: 1em;"><p id="msgbox" style="margin: 0;">　</p></div>
			<div style="display: flex; align-items: center;">
				<h2 style="margin: 0.25em;">起床・就寝時刻の設定</h2>
				<button id="setnowdate" class="btnbase btn" onclick="setNowDate()" style="font-size: 1.25em; padding: 0.5em 1em;">現在の時刻にする↓</button>

			</div>
			<div class="inputs" style="display: flex; margin: 1em">
				<input type="number" name="whrs" style="width: 7em" id="wakeuphr" min="0" max="23">
				<label style="margin:0.5em" for="whrs">時</label>
				
				<input type="number" name="wmin" style="width: 7em" id="wakeupmin" min="0" max="59">
				<label style="margin:0.5em" for="wmin">分</label>
				
				<input type="number" name="wsec" style="width: 7em" id="wakeupsec" min="0" max="59">
				<label style="margin:0.5em" for="wsec">秒</label>
			</div>
            <div class="buttons">
                <button id="wakeup" class="btnbase graybtn" onclick="wakeup(this)">Loading...</button>
                <button id="sleep" class="btnbase graybtn" onclick="sleep(this)">Loading...</button>
                <button id="breakfast" class="btnbase graybtn" onclick="breakfast(this)">Loading...</button>
            </div>
            <hr id="mainhr">
            <div class="list">
                <h2>就寝・起床時間の記録</h2>
                <!-- <table border="1"> -->
                <table id="slog">
                    <!-- タイトル -->
                    <tr>
                        <th>日付</th>
                        <th>起床</th>
                        <th>就寝</th>
                        <th>朝食</th>
                    </tr>
					<tr>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                        <td><input type="checkbox"></td>
                    </tr>
					<!-- data -->
                </table>
            </div>
        </div>
        <div id="overlay"></div>
    </body>
</html>

<script>
</script>

<style>
    a {
     color: black;
      text-decoration: none;
    }
    a:hover {
     color: aqua;
     cursor: pointer;
    }
</style>
