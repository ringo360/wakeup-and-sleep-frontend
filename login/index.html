<head>
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/login-and-register.css" />
    <title>(!)早寝早起き朝ごはんApp</title>
</head>
<html>
    <aside id="header"></aside>
    <body>
        <div class="title">
            <h1 style="text-align: center;">早寝早起き朝ごはんアプリ</h1>
        </div>
        <!-- <h1 class="result fail">Result</h1> -->
        <h1 id="login" class="subtitle" style="text-align: center;">ログイン</h1>
        <div class="loginform">
            <label for="user">ユーザー名</label>
            <input type="text" id="user" name="username">
        </div>
        <div class="loginform">
            <label for="user">パスワード</label>
            <input type="text" id="pass" name="password">
        </div>
        <div class="loginform flex-center">
            <button class="btnbase flex-center btn" id="loginbtn" onclick="login()">ログイン</button>
        </div>
		<p class="foot" style="text-align: center;">アカウント作成は<a href="../register/index.html">こちら</a></p>
    </body>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/util.js"></script>
	<script src="./index.js"></script>
</html>

<style>
	.login {
		display: flex;
		align-items: center;
		align-content: center;
		justify-content: center;
	}
	.loginform {
		/* display: flex; */
		justify-content: center;
	}
	#btn, #graybtn {
		margin: 1em;
	}
    .result {
        display: block;
        text-align: center;
        transition: all 0.5s ease;
    }
    .success {
        background-color: rgba(0, 255, 64, 0.5);
        animation-duration: 0.5s;
        animation-name: show;
        animation-fill-mode: forwards;
    }
    .fail {
        background-color: rgba(255, 0, 0, 0.5);
        animation-duration: 0.5s;
        animation-name: show;
        animation-fill-mode: forwards;
    }

    @keyframes show {
        from {
            scale: 0;
            opacity: 0;
        }

        to {
            scale: 1;
            opacity: 1;
        }
    }

</style>
