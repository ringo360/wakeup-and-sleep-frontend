<head>
    <link rel="stylesheet" href="../styles/global.css" />
    <title>(!)早寝早起き朝ごはんApp</title>
</head>
<html>
    <aside id="header"></aside>
    <body>
        <div class="title">
            <h1>早寝早起き朝ごはんアプリ</h1>
        </div>
        <!-- <h1 class="result fail">Result</h1> -->
        <h1 id="login" style="text-align: center;">ログイン</h1>
        <div class="loginform">
            <label for="user">ユーザー名</label>
            <input type="text" id="user" name="username">
        </div>
        <div class="loginform">
            <label for="user">パスワード</label>
            <input type="text" id="pass" name="password">
        </div>
        <div class="loginform">
            <button class="btnbase flex-center" id="btn" onclick="login()">ログイン</button>
        </div>
		<p style="text-align: center;">アカウント作成は<a href="../register/index.html">こちら</a></p>
    </body>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/util.js"></script>
</html>

<style>
	.login {
		display: flex;
		align-items: center;
		align-content: center;
		justify-content: center;
	}
	.loginform {
		display: flex;
		justify-content: center;
	}
	#btn, #graybtn {
		margin: 1em;
	}
    .result {
        display: block;
        text-align: center;
        transition: all 0.5s ease;
    }
    .success {
        background-color: rgba(0, 255, 64, 0.5);
        animation-duration: 0.5s;
        animation-name: show;
        animation-fill-mode: forwards;
    }
    .fail {
        background-color: rgba(255, 0, 0, 0.5);
        animation-duration: 0.5s;
        animation-name: show;
        animation-fill-mode: forwards;
    }

    @keyframes show {
        from {
            scale: 0;
            opacity: 0;
        }

        to {
            scale: 1;
            opacity: 1;
        }
    }

</style>

<script>
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    //tysm - https://stackoverflow.com/questions/35325370/how-do-i-post-a-x-www-form-urlencoded-request-using-fetch

    async function login() {
        const btn = document.getElementById('btn')
        btn.textContent = 'ログイン中...'
		switchButton(btn, true)
        const usr = await document.getElementById('user')
        const pass = await document.getElementById('pass')
        const details = {
            'username': usr.value,
            'password': pass.value
        }
        let formBody = []
        for (let prop in details) {
            let encodedKey = encodeURIComponent(prop)
            let encodedVal = encodeURIComponent(details[prop])
            formBody.push(encodedKey + "=" + encodedVal)
        }
        formBody = formBody.join("&")
        const res = await try_login(formBody)
        const json = await res.json()
        //login check
        if (res.status === 200) {
            console.log('Success')
            document.cookie = `RefT=${json.t}; path=/`
            document.cookie = `Name=${usr.value}; path=/`
            // await delay(500) delay
            const acc_json = await fetch_accToken(json.t)
            document.cookie = `AccT=${acc_json.t}; path=/`
			btn.textContent = 'ログイン'
            showresult(true)
			switchButton(btn, false)
        } else {
			btn.textContent = 'ログイン'
            showresult(false)
			switchButton(btn, false)
        }
    }
    async function showresult(isSuccess) {
        console.log('Appending...')
        if (isSuccess === true) {
            const elem = document.getElementById('login')
            elem.insertAdjacentHTML('beforebegin', '<h1 class="result success">ログインしました！</h1>')
            await delay(1000)
			const addedElem = document.querySelector('.result.success')
			if (addedElem) {
				addedElem.remove()
			}
            location.href = '../index.html'
        } else {
            
            const elem = document.getElementById('login')
            elem.insertAdjacentHTML('beforebegin', '<h1 class="result fail">ユーザー・パスワードが違います</h1>')
			await delay(2000)
			const addedElem = document.querySelector('.result.fail')
			if (addedElem) {
				addedElem.remove()
			}
        }
    }
</script>
