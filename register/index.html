<head>
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/login-and-register.css" />
    <title>(!)早寝早起き朝ごはんApp</title>
</head>
<html>
    <aside id="header"></aside>
    <body>
        <div class="title">
            <h1 style="text-align: center;">早寝早起き朝ごはんアプリ</h1>
        </div>
        <!-- <h1 class="result fail">Result</h1> -->
        <h1 id="register" class="subtitle" style="text-align: center;">登録</h1>
        <div class="registerform">
            <label for="user">ユーザー名</label>
            <input type="text" id="user" name="username">
        </div>
        <div class="registerform">
            <label for="user">パスワード</label>
            <input type="text" id="pass" name="password">
        </div>
        <div class="registerform flex-center">
            <button class="btnbase flex-center" id="btn" onclick="register()">登録</button>
        </div>
        <p class="foot" style="text-align: center;">ユーザー名とパスワードは英数字のみ入力できます。</p>
    </body>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/util.js"></script>
</html>

<style>
    .register {
		display: flex;
		align-items: center;
		align-content: center;
		justify-content: center;
	}
	.registerform {
		/* display: flex; */
		justify-content: center;
	}
	#btn, #graybtn {
		margin: 1em;
	}
    .result {
        display: block;
        text-align: center;
        
        transition: all 0.5s ease;
    }
    .success {
        background-color: rgba(0, 255, 64, 0.5);
        animation-duration: 0.5s;
        animation-name: show;
        animation-fill-mode: forwards;
    }
    .fail {
        background-color: rgba(255, 0, 0, 0.5);
        animation-duration: 0.5s;
        animation-name: show;
        animation-fill-mode: forwards;
    }

    @keyframes show {
        from {
            scale: 0;
            opacity: 0;
        }

        to {
            scale: 1;
            opacity: 1;
        }
    }

</style>

<script>
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const regex = /^[0-9a-zA-Z]+$/;

    //tysm - https://stackoverflow.com/questions/35325370/how-do-i-post-a-x-www-form-urlencoded-request-using-fetch

    async function register() {
        const btn = document.getElementById('btn')
        btn.textContent = '登録中...'
        switchButton(btn, true)
        const usr = await document.getElementById('user')
        const pass = await document.getElementById('pass')
        console.log(regex.test(usr.value))
        console.log(regex.test(pass.value))
        if (!regex.test(usr.value) || !regex.test(pass.value)) {
            switchButton(btn, false)
            btn.textContent = '登録'
            return showresult(false, '使えない文字が含まれています！')
        }
        const details = {
            'username': usr.value,
            'password': pass.value
        }
        let formBody = []
        for (let prop in details) {
            let encodedKey = encodeURIComponent(prop)
            let encodedVal = encodeURIComponent(details[prop])
            formBody.push(encodedKey + "=" + encodedVal)
        }
        formBody = formBody.join("&")
        const res = await postAPI(formBody, '/auth/register')
		if (!res.ok) {
			if (res.status === 400) {
                switchButton(btn, false)
                btn.textContent = '登録'
				showresult(false, 'そのユーザーは既に存在します！')
			} else {
                switchButton(btn, false)
                btn.textContent = '登録'
				showresult(false, `内部エラーが発生しました(${res.status})`)
			}
		} else {
            switchButton(btn, false)
            btn.textContent = '登録'
			showresult(true)
		}

    }
    async function showresult(isSuccess, msg = 'Failed!') {
        console.log('Appending...')
        if (isSuccess === true) {
            const elem = document.getElementById('register')
            elem.insertAdjacentHTML('beforebegin', '<h1 class="result success">作成しました！</h1>')
            await delay(1000)
			const addedElem = document.querySelector('.result.success')
			if (addedElem) {
				addedElem.remove()
			}
            location.href = '../login/index.html'
        } else {
            
            const elem = document.getElementById('register')
            elem.insertAdjacentHTML('beforebegin', `<h1 class="result fail">${msg}</h1>`)
			await delay(2000)
			const addedElem = document.querySelector('.result.fail')
			if (addedElem) {
				addedElem.remove()
			}
        }
    }
    const currentPageUrl = window.location.href;
    console.log(currentPageUrl)
    window.onload = function(){
        const perfEntries = performance.getEntriesByType("navigation");
        perfEntries.forEach(function(pe){
            switch( pe.type ){
                case 'navigate':
                    console.log('通常のアクセス');
                    break;
                case 'reload':
                    console.log('更新によるアクセス');
                    break;
                case 'back_forward':
                    console.log('戻る/進むによるアクセス on register');
                    location.href = '/'
                    break;
                case 'prerender':
                    console.log('レンダリング前');
                    break;
                }
        });
    }; 
</script>
