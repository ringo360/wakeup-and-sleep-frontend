<head>
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/login-and-register.css" />
    <title>(!)早寝早起き朝ごはんApp</title>
</head>
<html>
    <aside id="header"></aside>
    <body>
        <div class="title">
            <h1>早寝早起き朝ごはんアプリ</h1>
        </div>
        <!-- <h1 class="result fail">Result</h1> -->
        <h1 id="register" style="text-align: center;">登録</h1>
        <div class="registerform">
            <label for="user">ユーザー名</label>
            <input type="text" id="user" name="username">
        </div>
        <div class="registerform">
            <label for="user">パスワード</label>
            <input type="text" id="pass" name="password">
        </div>
        <div class="registerform">
            <button id="send" onclick="register()">登録</button>
        </div>
        <p style="text-align: center;">ユーザー名とパスワードは英数字のみ入力できます。</p>
    </body>
    <script src="/scripts/auth.js"></script>
</html>

<style>
    .result {
        display: block;
        text-align: center;
        
        transition: all 0.5s ease;
    }
    .success {
        background-color: rgba(0, 255, 64, 0.5);
        animation-duration: 0.5s;
        animation-name: show;
        animation-fill-mode: forwards;
    }
    .fail {
        background-color: rgba(255, 0, 0, 0.5);
        animation-duration: 0.5s;
        animation-name: show;
        animation-fill-mode: forwards;
    }

    @keyframes show {
        from {
            scale: 0;
            opacity: 0;
        }

        to {
            scale: 1;
            opacity: 1;
        }
    }

</style>

<script>
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const regex = /^[0-9a-zA-Z]+$/

    //tysm - https://stackoverflow.com/questions/35325370/how-do-i-post-a-x-www-form-urlencoded-request-using-fetch

    async function register() {
        const btn = document.getElementById('send')
        btn.textContent = '登録中...'
        const usr = await document.getElementById('user')
        const pass = await document.getElementById('pass')
        if (!regex.test(usr) || !regex.test(pass)) {
            return showresult(false, '使えない文字が含まれています！')
        }
        const details = {
            'username': usr.value,
            'password': pass.value
        }
        let formBody = []
        for (let prop in details) {
            let encodedKey = encodeURIComponent(prop)
            let encodedVal = encodeURIComponent(details[prop])
            formBody.push(encodedKey + "=" + encodedVal)
        }
        formBody = formBody.join("&")
        const res = await postAPI(formBody, '/auth/register')
		if (!res.ok) {
			if (res.status === 400) {
				showresult(false, 'そのユーザーは既に存在します！')
			} else {
				showresult(false, `内部エラーが発生しました(${res.status})`)
			}
		} else {
			showresult(true)
		}

    }
    async function showresult(isSuccess, msg = 'Failed!') {
        console.log('Appending...')
        if (isSuccess === true) {
            const elem = document.getElementById('register')
            elem.insertAdjacentHTML('beforebegin', '<h1 class="result success">作成しました！</h1>')
            await delay(1000)
			const addedElem = document.querySelector('.result.success')
			if (addedElem) {
				addedElem.remove()
			}
            location.href = '../login/index.html'
        } else {
            
            const elem = document.getElementById('register')
            elem.insertAdjacentHTML('beforebegin', `<h1 class="result fail">${msg}</h1>`)
			await delay(2000)
			const addedElem = document.querySelector('.result.fail')
			if (addedElem) {
				addedElem.remove()
			}
        }
    }
</script>
